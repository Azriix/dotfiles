# robbyrussell-like prompt
add_newline = false
format = "[➜](bold green) $directory$git_branch$git_status$character"

# Green if the last command succeeded, red otherwise
[character]
success_symbol = "[\\$](bold green)"
error_symbol = "[\\$](bold red)"

[directory]
style = "bold cyan"
truncation_length = 1

[git_branch]
format = "[git:\\(](bold blue)[$branch](red)[\\)](bold blue) "

[git_status]
format = "[$all_status$ahead_behind](yellow)"
conflicted = "=${count} "
stashed    = "*${count} "
deleted    = "-${count} "
renamed    = "→${count} "
modified   = "!${count} "
staged     = "+${count} "
untracked  = "?${count} "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇡${ahead_count}⇣${behind_count} "
